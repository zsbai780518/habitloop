name: habitloop
description: HabitLoop - 离线优先的习惯追踪器，让坚持可视化
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.1
  
  # 本地数据库
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # 数据可视化
  fl_chart: ^0.65.0
  
  # 本地通知
  flutter_local_notifications: ^16.3.0
  
  # 工具类
  intl: ^0.18.1
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  
  # UI 组件
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: HabitLoopIcons
      fonts:
        - asset: assets/icons/habit_icons.ttf
